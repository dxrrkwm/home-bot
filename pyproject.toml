[project]
name = "home-bot"
version = "1.0.0"
description = "Telegram bot for my laptop, lamp, power station, reminders and finances"
requires-python = ">=3.12"
dependencies = ["cryptography", "pycryptodome"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90"]
ignore = ["E501", "E731"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
